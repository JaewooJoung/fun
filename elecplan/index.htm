<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0}</style>
</head>
<body>
<title>ElecPlan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: technology palette on the left, House A / House B side by side, live analysis underneath. */
:root {
  --bg: #FAFAFA;          /* warm white */
  --panel: #F0F2F5;       /* light grey */
  --surface: #FFFFFF;
  --ink: #16243A;
  --muted: #5B6779;
  --line: #DCE1E8;
  --navy: #1B365D;        /* trust, House A */
  --sky: #3C83C4;         /* House B */
  --green: #2E8B57;       /* pros */
  --amber: #FF8C00;       /* cons */
  --amber-ink: #A85A00;
  --red: #C8372D;
  --green-soft: #E3F1E8;
  --amber-soft: #FFF1DE;
  --red-soft: #FBE5E3;
  --navy-soft: #E4EAF2;
  --shadow: 0 1px 2px rgb(22 36 58 / .06), 0 6px 20px rgb(22 36 58 / .06);
  --f-display: "Familjen Grotesk", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "Figtree", "Noto Sans KR", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E141C; --panel: #151D28; --surface: #1A2431; --ink: #E6ECF4; --muted: #95A2B5; --line: #2A3646;
  --navy: #8DB2E6; --sky: #5FC1E8; --green: #4CC38A; --amber: #FFA940; --amber-ink: #FFB65C; --red: #FF7468;
  --green-soft: #173327; --amber-soft: #3A2A14; --red-soft: #3D1F1D; --navy-soft: #1E2C40;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E141C; --panel: #151D28; --surface: #1A2431; --ink: #E6ECF4; --muted: #95A2B5; --line: #2A3646;
  --navy: #8DB2E6; --sky: #5FC1E8; --green: #4CC38A; --amber: #FFA940; --amber-ink: #FFB65C; --red: #FF7468;
  --green-soft: #173327; --amber-soft: #3A2A14; --red-soft: #3D1F1D; --navy-soft: #1E2C40;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- header ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in, .wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--navy); display: grid; place-items: center; flex: none; }
.mark svg { width: 20px; height: 20px; }
.brand h1 { font-size: 21px; line-height: 1.1; }
.brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
.lang { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.lang .flag { font-size: 14px; line-height: 1; }

/* ---------- main grid ---------- */
.wrap { padding-block: 24px 48px; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 24px; align-items: start; }
.palette { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 12px; }
.palette-intro { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.cards { display: flex; flex-direction: column; gap: 8px; list-style: none; padding: 0; margin: 0; }
.workspace { display: flex; flex-direction: column; gap: 28px; min-width: 0; }

/* ---------- tech cards ---------- */
.tech { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: grab; user-select: none; touch-action: none; transition: border-color .15s, transform .15s, opacity .15s; }
.tech:hover { border-color: color-mix(in srgb, var(--navy) 40%, var(--line)); }
.tech:active { cursor: grabbing; }
.tech.off { opacity: .45; filter: grayscale(1); cursor: not-allowed; }
.ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--navy-soft); color: var(--navy); flex: none; }
.ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tech-t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.tech-d { font-size: 12px; color: var(--muted); line-height: 1.3; }
.adds { display: flex; gap: 4px; }
.adds button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); font: 600 12px/1 var(--f-display); color: var(--navy); }
.adds button:hover:not(:disabled) { background: var(--navy); color: var(--bg); border-color: var(--navy); }
.adds button:disabled { opacity: .35; cursor: not-allowed; }
.tip { position: absolute; left: 12px; right: 12px; top: calc(100% + 6px); z-index: 15; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; pointer-events: none; opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s; }
.tech:hover .tip, .tech:focus-within .tip { opacity: 1; transform: none; }
.tip:empty { display: none; }
.rules { font-size: 12px; color: var(--muted); background: var(--panel); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 4px; }
.rules b { color: var(--ink); font-weight: 600; }

/* drag ghost */
.ghost { position: fixed; z-index: 100; pointer-events: none; width: 250px; box-shadow: 0 18px 40px rgb(0 0 0 / .22); transform: rotate(-2deg); cursor: grabbing; transition: none; }
.ghost.back { transition: left .35s cubic-bezier(.3,1.4,.5,1), top .35s cubic-bezier(.3,1.4,.5,1), opacity .35s; opacity: .2; }
.ghost.denied { border-color: var(--red); background: var(--red-soft); }
body.dragging { cursor: grabbing; user-select: none; }

/* ---------- houses ---------- */
.houses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.house { --hc: var(--navy); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; transition: border-color .2s, box-shadow .2s, background .2s; outline: 2px dashed transparent; outline-offset: 4px; }
.house[data-h="1"] { --hc: var(--sky); }
.house-h { display: flex; align-items: center; gap: 12px; }
.hmark { width: 40px; height: 40px; flex: none; border-radius: 10px; background: color-mix(in srgb, var(--hc) 14%, transparent); color: var(--hc); display: grid; place-items: center; }
.hmark svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.house-h h2 { font-size: 19px; }
.tagline { border: 0; background: none; padding: 0; width: 100%; font-size: 13px; color: var(--muted); border-bottom: 1px dashed transparent; }
.tagline:hover, .tagline:focus { border-bottom-color: var(--line); outline: none; }
.basics { display: grid; gap: 10px; background: var(--panel); border-radius: var(--r); padding: 12px 14px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
.money { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px 0 4px; }
.money:focus-within { border-color: var(--sky); }
.money input { border: 0; background: none; width: 84px; text-align: right; padding: 6px 6px; font-family: var(--f-num); font-size: 14px; outline: none; }
.money span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; cursor: pointer; }
.check input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--navy); flex: none; }
.check small { display: block; color: var(--muted); font-size: 12px; }

.zone { display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.zone-h { display: flex; justify-content: space-between; align-items: baseline; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px 14px; text-align: center; color: var(--muted); font-size: 13px; }
body.dragging .house.can { outline-color: color-mix(in srgb, var(--hc) 60%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--hc) 10%, transparent), 0 0 32px color-mix(in srgb, var(--hc) 22%, transparent); }
body.dragging .house.can.over { background: color-mix(in srgb, var(--hc) 5%, var(--surface)); outline-color: var(--hc); }
body.dragging .house.no { outline-color: color-mix(in srgb, var(--red) 55%, transparent); }
body.dragging .house.no.over { background: var(--red-soft); }
.deny { display: none; font-size: 12.5px; color: var(--red); font-weight: 600; }
body.dragging .house.no .deny { display: block; }

.item { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; background: var(--surface); animation: pop .28s ease-out; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
.item-top { display: flex; align-items: center; gap: 10px; }
.item-top .ic { width: 32px; height: 32px; }
.item-name { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.badge { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--amber-soft); color: var(--amber-ink); }
.ghost-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; font-size: 12.5px; padding: 4px 9px; white-space: nowrap; }
.ghost-btn:hover { border-color: var(--navy); color: var(--navy); }
.ghost-btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--bg); }
.x { border: 0; background: none; width: 28px; height: 28px; border-radius: 7px; color: var(--muted); font-size: 18px; line-height: 1; }
.x:hover { background: var(--red-soft); color: var(--red); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 6px 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 7px; }
.seg button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button[aria-checked="true"]::before { background: var(--hc); border-color: var(--hc); }
.vals { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; align-items: flex-end; }
.val { display: grid; gap: 2px; }
.val label, .val .k { font-size: 11.5px; color: var(--muted); }
.val .v { font-family: var(--f-num); font-size: 15px; }
.val .money input { width: 92px; }
.val .money.short input { width: 44px; }
.list { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.link { border: 0; background: none; padding: 0; color: var(--sky); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- dashboard ---------- */
.dash { display: grid; gap: 20px; }
.dash-h { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.dash-h h2 { font-size: 22px; }
.verdict { font-size: 14px; color: var(--muted); max-width: 60ch; margin: 4px 0 0; }
.verdict b { color: var(--ink); }
.engine { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.engine i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
.results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.res { --hc: var(--navy); background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--hc); border-radius: 14px; padding: 18px; display: grid; gap: 16px; align-content: start; }
.res[data-h="1"] { --hc: var(--sky); }
.res-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.res-h h3 { font-size: 16px; }
.res-h span { font-size: 12.5px; color: var(--muted); text-align: right; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--panel); padding: 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .big { font-family: var(--f-num); font-size: clamp(17px, 2vw, 22px); line-height: 1.15; white-space: nowrap; overflow: hidden; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi .sub.good { color: var(--green); font-weight: 600; }
.kpi .sub.bad { color: var(--red); font-weight: 600; }
.small-print { font-size: 12.5px; color: var(--muted); margin: -6px 0 0; }
.pc { display: grid; gap: 12px; }
.pc h4 { margin: 0 0 6px; font: 600 13px var(--f-display); display: flex; align-items: center; gap: 7px; }
.pc ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pc li { font-size: 13.5px; line-height: 1.45; padding: 7px 10px 7px 30px; border-radius: 8px; position: relative; }
.pros li { background: var(--green-soft); }
.cons li { background: var(--amber-soft); }
.pc li::before { position: absolute; left: 10px; top: 7px; font-weight: 700; font-family: var(--f-num); }
.pros li::before { content: "✓"; color: var(--green); }
.cons li::before { content: "!"; color: var(--amber-ink); left: 13px; }
.pros h4 { color: var(--green); }
.cons h4 { color: var(--amber-ink); }
.none { color: var(--muted); font-size: 13px; }

.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; position: relative; }
.chart-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.chart-h h3 { font-size: 16px; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.chart { width: 100%; height: 300px; display: block; touch-action: pan-y; }
.chart text { font-family: var(--f-body); font-size: 11.5px; fill: var(--muted); }
.ctip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; white-space: nowrap; opacity: 0; transition: opacity .12s; }
.ctip.on { opacity: 1; }
.ctip b { font-family: var(--f-num); font-weight: 500; }

/* rolling digits */
.roll { display: inline-flex; overflow: hidden; height: 1.15em; line-height: 1.15em; vertical-align: bottom; }
.roll > span { display: inline-block; height: 1.15em; }
.dg { overflow: hidden; }
.dg .st { display: flex; flex-direction: column; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.dg .st b { height: 1.15em; font-weight: inherit; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 10px 30px rgb(0 0 0 / .25); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 120; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: var(--red); color: #fff; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .palette { position: static; }
  .cards { flex-direction: row; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .tech { flex: 0 0 236px; scroll-snap-align: start; touch-action: pan-x; }
  .tip { display: none; }
  .rules { display: none; }
}
@media (max-width: 760px) {
  .houses, .results { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpi { grid-template-columns: 1fr auto; align-items: baseline; }
  .kpi .sub { grid-column: 1 / -1; }
  .brand p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<div class="top"><div class="top-in">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/><path d="M13 11l-3 4h4l-3 4"/></svg></div>
    <div><h1>ElecPlan</h1><p data-i="tagline"></p></div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="sv"><span class="flag">🇸🇪</span>Svenska</button>
    <button type="button" data-lang="ko"><span class="flag">🇰🇷</span>한국어</button>
    <button type="button" data-lang="en"><span class="flag">🇬🇧</span>English</button>
  </div>
</div></div>

<div class="wrap">
  <aside class="palette" aria-labelledby="pal-h">
    <div>
      <div class="eyebrow" id="pal-h" data-i="palette"></div>
      <p class="palette-intro" data-i="paletteHint"></p>
    </div>
    <ul class="cards" id="cards"></ul>
    <div class="rules">
      <div><b data-i="rulesH"></b></div>
      <div data-i="rule1"></div>
      <div data-i="rule2"></div>
    </div>
  </aside>

  <main class="workspace">
    <section aria-labelledby="ws-h">
      <div class="eyebrow" id="ws-h" data-i="workspace" style="margin-bottom:10px"></div>
      <div class="houses" id="houses"></div>
    </section>

    <section class="dash" aria-labelledby="dash-h">
      <div class="dash-h">
        <div>
          <h2 id="dash-h" data-i="dashboard"></h2>
          <p class="verdict" id="verdict"></p>
        </div>
        <span class="engine" id="engine"><i></i><span></span></span>
      </div>
      <div class="results" id="results"></div>
      <div class="chart-card">
        <div class="chart-h">
          <h3 data-i="chartH"></h3>
          <div class="legend">
            <span><i style="background:var(--navy)"></i>House A</span>
            <span><i style="background:var(--sky)"></i>House B</span>
            <span data-i="chartLegend0"></span>
          </div>
        </div>
        <svg class="chart" id="chart" role="img"></svg>
        <div class="ctip" id="ctip"></div>
      </div>
    </section>
  </main>
</div>

/* ---------------- engine ---------------- */
const engine = {
  ok: false,
  async load() {
    let bytes = null;
    try { const r = await fetch('calc.wasm'); if (r.ok) bytes = await r.arrayBuffer(); } catch (e) {}
    if (!bytes && CALC_WASM_B64) bytes = Uint8Array.from(atob(CALC_WASM_B64), c => c.charCodeAt(0));
    const { instance } = await WebAssembly.instantiate(bytes, {});
    const e = this.x = instance.exports;
    this.IN = new Float64Array(e.memory.buffer, e.in_ptr(), 64);
    this.OUT = new Float64Array(e.memory.buffer, e.out_ptr(), 272);
    this.n = e.tech_count();
    this.ok = true;
  },
  list(t) { return { price: this.x.list_price(t, 0), monthly: this.x.list_price(t, 1), years: this.x.list_price(t, 2) }; },
  write(h) {
    const I = this.IN; I.fill(0);
    I[0] = +h.bill || 0; I[1] = h.pump ? 1 : 0;
    for (const [t, q] of Object.entries(h.techs)) {
      const b = 2 + t * 5;
      I[b] = 1; I[b + 1] = q.mode === 'sub' ? 1 : 0; I[b + 2] = +q.price || 0; I[b + 3] = +q.monthly || 0; I[b + 4] = +q.years || 0;
    }
  },
  check(h, t) { this.write(h); return this.x.check(t); },
  compute(h) {
    this.write(h); this.x.compute();
    const O = this.OUT;
    return { initial: O[0], bill: O[1], savings: O[2], turnover: O[3], pros: O[4], cons: O[5], subs: O[6], after: O[7], share: O[8], fee: O[9],
             series: Array.from(O.subarray(16, 16 + 241)), n: Object.keys(h.techs).length };
  }
};

/* ---------------- state ---------------- */
const state = { lang: 'sv', houses: [] };
const L = () => T[state.lang];
const HN = i => 'House ' + 'AB'[i];
const fmt = v => new Intl.NumberFormat(LOCALE[state.lang], { maximumFractionDigits: 0 }).format(Math.round(v));
const fmtKr = v => fmt(v) + ' kr';
const compact = v => new Intl.NumberFormat(LOCALE[state.lang], { notation: 'compact', maximumFractionDigits: 1 }).format(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function quote(t, mode) { const l = engine.list(t); return { mode, price: l.price, monthly: l.monthly, years: l.years, custom: false, editing: false }; }
function seed() {
  state.houses = [
    { tagline: null, bill: 3000, pump: true, techs: { 0: quote(0, 'sub'), 3: quote(3, 'one') } },
    { tagline: null, bill: 3000, pump: true, techs: { 0: quote(0, 'one'), 1: quote(1, 'one'), 2: quote(2, 'one'), 5: quote(5, 'one') } }
  ];
}

function reason(code, hi) {
  const l = L(), h = HN(hi);
  return code === 1 ? l.r1(h) : code === 2 ? l.r2(h) : code === 3 ? l.r3(h) : '';
}

    </li>`).join('');
  updatePalette();

function updatePalette() {
  document.querySelectorAll('.tech').forEach(card => {
    const t = +card.dataset.t;
    const codes = state.houses.map(h => engine.check(h, t));
    const why = codes.map((c, i) => reason(c, i)).filter(Boolean);
    card.classList.toggle('off', codes.every(c => c !== 0));
    card.querySelector('.tip').textContent = why.join(' ');
    card.title = why.join('\n');
    card.querySelectorAll('[data-add]').forEach(b => { const c = codes[+b.dataset.add]; b.disabled = c !== 0; b.title = reason(c, +b.dataset.add); });
  });
}

  else v.innerHTML = l.verdict(a > b ? HN(0) : HN(1), esc(fmtKr(Math.abs(a - b))), 10);

}

function turnText(m) {
  const l = L();
  if (m < 0) return l.tNever;
  if (m === 0) return l.tNow;
  return l.ty(Math.floor(m / 12), m % 12);
}

/* rolling digits: each digit is a 0–9 strip that slides to its new value */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function roll(el, text) {
  if (el.dataset.v === text) return;
  el.dataset.v = text;
  el.setAttribute('aria-label', text);
  const chars = [...text];
  const shape = chars.map(c => /\d/.test(c) ? '#' : c).join('');
  let wrap = el.firstElementChild;
  if (!wrap || wrap.dataset.shape !== shape) {
    wrap = document.createElement('span');
    wrap.className = 'roll'; wrap.dataset.shape = shape; wrap.setAttribute('aria-hidden', 'true');
    wrap.innerHTML = chars.map(c => /\d/.test(c)
      ? `<span class="dg"><span class="st">${'0123456789'.split('').map(d => `<b>${d}</b>`).join('')}</span></span>`
      : `<span>${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('');
    el.replaceChildren(wrap);
    if (!reduceMotion) { wrap.offsetHeight; }
  }
  let k = 0;
  const strips = wrap.querySelectorAll('.st');
  chars.forEach(c => { if (/\d/.test(c)) strips[k++].style.transform = `translateY(${-1.15 * +c}em)`; });
}

/* ---------------- chart ---------------- */
function drawChart(res) {
  const svg = document.getElementById('chart');
  const W = svg.clientWidth || 800, H = svg.clientHeight || 300;
  const pad = { l: 58, r: 16, t: 18, b: 30 };
  const all = res.flatMap(r => r.series);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  if (hi - lo < 1000) { hi += 1000; }
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const X = m => pad.l + (m / 240) * (W - pad.l - pad.r);
  const Y = v => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);
  const l = L();
  let g = '';
  for (let v = lo; v <= hi + 1; v += step) {
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 0 : 1}"/>`;
    g += `<text x="${pad.l - 8}" y="${Y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  }
  g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  for (let y = 0; y <= 20; y += 5) {
    g += `<text x="${X(y * 12)}" y="${H - 8}" text-anchor="middle">${y} ${l.yr}</text>`;
  }
  const colors = ['var(--navy)', 'var(--sky)'];
  res.forEach((r, i) => {
    if (!r.n) return;
    const d = r.series.map((v, m) => `${m ? 'L' : 'M'}${X(m).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    g += `<path d="${d} L${X(240)},${Y(lo)} L${X(0)},${Y(lo)}Z" fill="${colors[i]}" opacity=".06"/>`;
    g += `<path d="${d}" fill="none" stroke="${colors[i]}" stroke-width="2.4" stroke-linejoin="round"/>`;
  });
  // break-even markers
  const marks = [];
  res.forEach((r, i) => {
    if (!r.n || r.turnover < 0 || r.turnover > 240) return;
    marks.push({ x: X(r.turnover), y: Y(0), c: colors[i], label: `${'AB'[i]} · ${turnText(r.turnover)}`, i });
  });
  marks.sort((a, b) => a.x - b.x);
  marks.forEach((m, k) => {
    const up = k % 2 === 0;
    const ty = m.y + (up ? -12 : 20);
    const anchor = m.x > W - 120 ? 'end' : m.x < pad.l + 60 ? 'start' : 'middle';
    g += `<circle cx="${m.x}" cy="${m.y}" r="5" fill="var(--surface)" stroke="${m.c}" stroke-width="2.4"/>`;
    g += `<text x="${m.x}" y="${ty}" text-anchor="${anchor}" style="fill:${m.c};font-weight:600">${esc(m.label)}</text>`;
  });
  // A/B crossover
  if (res[0].n && res[1].n) {
    const a = res[0].series, b = res[1].series;
    for (let m = 2; m <= 240; m++) {
      if (Math.sign(a[m] - b[m]) !== Math.sign(a[m - 1] - b[m - 1]) && Math.sign(a[m - 1] - b[m - 1]) !== 0) {
        const cx = X(m), cy = Y(a[m]);
        g += `<line x1="${cx}" x2="${cx}" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4"/>`;
        g += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--amber)" stroke="var(--surface)" stroke-width="2"/>`;
        g += `<text x="${cx + (cx > W - 140 ? -10 : 10)}" y="${pad.t + 10}" text-anchor="${cx > W - 140 ? 'end' : 'start'}" style="fill:var(--ink);font-weight:600">${l.crossAB} · ${turnText(m)}</text>`;
        break;
      }
    }
  }
  g += `<line id="hover" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--ink)" stroke-width="1" opacity="0"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('aria-label', l.chartH);
  svg.innerHTML = g;
  svg._chart = { X, pad, W, res };
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function chartHover(e) {
  const svg = e.currentTarget, c = svg._chart, tip = document.getElementById('ctip');
  if (!c) return;
  const rect = svg.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const m = Math.round(Math.max(0, Math.min(240, (x - c.pad.l) / (c.W - c.pad.l - c.pad.r) * 240)));
  const line = svg.querySelector('#hover');
  line.setAttribute('x1', c.X(m)); line.setAttribute('x2', c.X(m)); line.setAttribute('opacity', '.35');
  const l = L();
  tip.innerHTML = `${turnText(m) === l.tNow ? '0' : turnText(m)}<br>` + c.res.map((r, i) => r.n ? `House ${'AB'[i]}: <b>${esc(fmtKr(r.series[m]))}</b>` : '').filter(Boolean).join('<br>');
  const card = svg.parentElement.getBoundingClientRect();
  const left = e.clientX - card.left;
  tip.style.left = Math.min(card.width - tip.offsetWidth - 8, Math.max(8, left + 12)) + 'px';
  tip.style.top = (rect.top - card.top + 20) + 'px';
  tip.classList.add('on');
}

/* ---------------- updates ---------------- */
function refresh(structure) {
  if (structure) renderHouses();
  updatePalette();
  renderResults();
}

let toastTimer;
function toast(msg, warn) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('warn', !!warn); t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 3200);
}

function addTech(hi, t) {
  const h = state.houses[hi];
  const code = engine.check(h, t);
  if (code !== 0) { toast(reason(code, hi), true); return false; }
  h.techs[t] = quote(t, 'one');
  refresh(true);
  toast(L().added(L().tech[t][0], HN(hi)));
  return true;
}

function removeTech(hi, t) {
  const h = state.houses[hi];
  delete h.techs[t];
  if (h.techs[5] && !(h.techs[1] && h.techs[2])) { delete h.techs[5]; toast(L().dropped, true); }
  refresh(true);
}

/* ---------------- drag & drop (pointer events: mouse, pen and touch) ---------------- */
function initDrag() {
  const cards = document.getElementById('cards');
  let drag = null;

  cards.addEventListener('pointerdown', e => {
    const card = e.target.closest('.tech');
    if (!card || e.target.closest('button') || e.button > 0) return;
    drag = { card, t: +card.dataset.t, x0: e.clientX, y0: e.clientY, live: false, id: e.pointerId };
  });

  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.live) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
      start(e);
    }
    e.preventDefault();
    move(e);
  }, { passive: false });

  const finish = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (!d.live) return;
    document.body.classList.remove('dragging');
    const zone = d.over;
    const ok = zone && zone.classList.contains('can');
    document.querySelectorAll('.house').forEach(z => z.classList.remove('can', 'no', 'over'));
    if (ok && e.type === 'pointerup') {
      d.ghost.remove();
      addTech(+zone.dataset.h, d.t);
    } else {
      if (zone && e.type === 'pointerup') toast(reason(engine.check(state.houses[+zone.dataset.h], d.t), +zone.dataset.h), true);
      const r = d.card.getBoundingClientRect();
      d.ghost.classList.add('back');
      d.ghost.style.left = r.left + 'px'; d.ghost.style.top = r.top + 'px';
      setTimeout(() => d.ghost.remove(), 360);
    }
  };
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);

  function start(e) {
    drag.live = true;
    const r = drag.card.getBoundingClientRect();
    drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
    const g = drag.ghost = drag.card.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('off');
    g.style.width = Math.min(r.width, 260) + 'px';
    document.body.appendChild(g);
    document.body.classList.add('dragging');
    document.querySelectorAll('.house').forEach(z => {
      const hi = +z.dataset.h, code = engine.check(state.houses[hi], drag.t);
      z.classList.add(code === 0 ? 'can' : 'no');
      z.querySelector('.deny').textContent = reason(code, hi);
    });
  }
  function move(e) {
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const zone = under && under.closest('.house');
    if (zone !== drag.over) {
      drag.over && drag.over.classList.remove('over');
      zone && zone.classList.add('over');
      drag.over = zone;
      drag.ghost.classList.toggle('denied', !!zone && zone.classList.contains('no'));
    }
  }
}

/* ---------------- events ---------------- */
function initEvents() {
  document.querySelector('.lang').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]'); if (!b) return;
    state.lang = b.dataset.lang;
    try { localStorage.setItem('elecplan-lang', state.lang); } catch (err) {}
    renderStatic(); renderPalette(); renderHouses(); renderResults();
  });

  document.getElementById('cards').addEventListener('click', e => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    addTech(+b.dataset.add, +b.closest('.tech').dataset.t);
  });

  const houses = document.getElementById('houses');
  houses.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const li = b.closest('.item'), hi = +li.dataset.h, t = +li.dataset.t;
    const q = state.houses[hi].techs[t];
    const act = b.dataset.act;
    if (act === 'remove') return removeTech(hi, t);
    if (act === 'edit') q.editing = !q.editing;
    if (act === 'one' || act === 'sub') q.mode = act;
    if (act === 'reset') Object.assign(q, quote(t, q.mode), { editing: q.editing });
    refresh(true);
    if (act === 'edit' && q.editing) document.querySelector(`.item[data-h="${hi}"][data-t="${t}"] input`)?.focus();
  });

  houses.addEventListener('input', e => {
    const el = e.target, id = el.id;
    let m;
    if ((m = id.match(/^bill-(\d)$/))) state.houses[+m[1]].bill = Math.max(0, +el.value || 0);
    else if ((m = id.match(/^pump-(\d)$/))) state.houses[+m[1]].pump = el.checked;
    else if ((m = id.match(/^tagline-(\d)$/))) state.houses[+m[1]].tagline = el.value;
    else if ((m = id.match(/^([pmy])-(\d)-(\d)$/))) {
      const q = state.houses[+m[2]].techs[+m[3]];
      q[{ p: 'price', m: 'monthly', y: 'years' }[m[1]]] = Math.max(0, +el.value || 0);
      if (!q.custom) {
        q.custom = true;
        const name = el.closest('.item').querySelector('.item-name');
        name.insertAdjacentHTML('beforeend', `<span class="badge">${L().custom}</span>`);
      }
    } else return;
    updatePalette(); renderResults();
  });

  const svg = document.getElementById('chart');
  svg.addEventListener('pointermove', chartHover);
  svg.addEventListener('pointerleave', () => {
    document.getElementById('ctip').classList.remove('on');
    svg.querySelector('#hover')?.setAttribute('opacity', '0');
  });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderResults, 120); });
}

/* ---------------- boot ---------------- */
(async () => {
  try { const s = localStorage.getItem('elecplan-lang'); if (T[s]) state.lang = s; } catch (err) {}
  renderStatic();
  const badge = document.querySelector('#engine span');
  try { await engine.load(); }
  catch (err) {
    document.getElementById('engine').querySelector('i').style.background = 'var(--red)';
    badge.textContent = L().engineFail; console.error(err); return;
  }
  seed();
  renderPalette(); renderHouses(); renderResults();
  badge.dataset.i = 'engineOk'; badge.textContent = L().engineOk;
  initDrag(); initEvents();
})();
</script>
