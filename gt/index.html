<!doctype html>
<html lang="sv" data-contrast="high">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Linjen – Västtrafik</title>
<meta name="description" content="Accessible line-based journey guidance for Västtrafik with spoken directions in Swedish, English and Korean.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M16 4v24' stroke='%23ffd400' stroke-width='5'/%3E%3Ccircle cx='16' cy='7' r='4' fill='%23fff'/%3E%3Ccircle cx='16' cy='25' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* 초고대비가 기본. '보통 대비'는 설정에서 고를 수 있다. */
:root {
  --bg: #000000; --panel: #111111; --fg: #ffffff; --muted: #d6d6d6; --dim: #8f8f8f;
  --accent: #ffd400; --accent-ink: #000000; --focus: #00e5ff; --line: #ffffff;
  --ok: #7CFC00; --warn: #ffd400; --bad: #ff6b6b; --border: #ffffff;
  --radius: 14px;
  color-scheme: dark;
}
:root[data-contrast="normal"] {
  --bg: #f4f6f9; --panel: #ffffff; --fg: #111827; --muted: #374151; --dim: #6b7280;
  --accent: #005293; --accent-ink: #ffffff; --focus: #ff8a00; --line: #111827;
  --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --border: #9ca3af;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 600 20px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  -webkit-text-size-adjust: 100%;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 상단 ---------- */
header { border-bottom: 3px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
header .wrap { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: .01em; }
.langs { display: flex; gap: 6px; }
.btn {
  min-height: 56px; min-width: 56px; padding: 0 18px; border-radius: var(--radius);
  border: 3px solid var(--border); background: var(--panel); color: var(--fg); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; text-decoration: none;
}
.btn[aria-pressed="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { min-height: 48px; min-width: 48px; padding: 0 12px; font-size: 18px; }
.btn svg { width: 28px; height: 28px; flex: none; }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- 화면 공통 ---------- */
main { padding: 16px 0 120px; }
h2 { font-size: 28px; margin: 6px 0 14px; line-height: 1.25; }
label.field { display: block; margin: 0 0 14px; }
label.field > span { display: block; font-size: 20px; margin-bottom: 6px; }
.inrow { display: flex; gap: 8px; }
input[type=text], input[type=password] {
  width: 100%; min-height: 60px; padding: 0 16px; font-size: 22px; font-weight: 700;
  background: var(--panel); color: var(--fg); border: 3px solid var(--border); border-radius: var(--radius);
}
input::placeholder { color: var(--dim); }
.inrow { position: relative; }
.inrow .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); min-height: 44px; min-width: 44px; border-width: 2px; }
.inrow input { padding-right: 60px; }
.sugs { list-style: none; margin: 6px 0 0; padding: 0; border: 3px solid var(--accent); border-radius: var(--radius); overflow: auto; max-height: min(62vh, 520px); background: var(--panel); }
.sugs li[role="option"] { display: flex; gap: 12px; align-items: center; padding: 10px 14px; min-height: 60px; border-top: 2px solid color-mix(in srgb, var(--border) 35%, transparent); cursor: pointer; }
.sugs li[aria-selected="true"], .sugs li[role="option"]:hover { background: var(--accent); color: var(--accent-ink); }
.sugs .ic { font-size: 26px; width: 34px; text-align: center; flex: none; }
.sugs .tx { min-width: 0; }
.sugs .mn { display: block; font-size: 21px; font-weight: 800; overflow-wrap: anywhere; }
.sugs mark { background: transparent; color: inherit; text-decoration: underline 3px; text-underline-offset: 3px; }
.sugs small { display: block; font-size: 16px; opacity: .85; font-weight: 600; }
.sugs .sgh { padding: 8px 14px 4px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-top: 2px solid var(--border); }
.sugs .sgh:first-child { border-top: 0; }
.sugs .sgs { padding: 12px 14px; color: var(--muted); border-top: 2px solid color-mix(in srgb, var(--border) 35%, transparent); }
.pick { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.pick:empty { display: none; }
.pick { border: 3px solid var(--ok); border-radius: var(--radius); padding: 8px 12px; }
.pick .ok { color: var(--ok); font-size: 24px; font-weight: 900; }
.pick .ic { font-size: 24px; }
.pick b { display: block; font-size: 21px; }
.pick small { display: block; font-size: 16px; color: var(--muted); font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 18px; }
.actions .btn { flex: 1 1 auto; }
.recent { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.recent .btn { width: 100%; justify-content: flex-start; text-align: left; min-height: 64px; font-size: 19px; }
.msg { border: 3px solid var(--warn); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 16px; }
.msg.bad { border-color: var(--bad); }
.muted { color: var(--muted); font-weight: 600; }

/* ---------- 경로 선택 ---------- */
.opts { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.opt { width: 100%; text-align: left; display: block; padding: 14px 16px; min-height: 90px; }
.opt .t { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
.opt .d { color: var(--muted); font-size: 18px; margin-top: 2px; }
.opt.btn { display: block; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; padding: 2px 10px; font-weight: 900; font-size: 20px; border: 2px solid var(--border); }
.arrow { color: var(--muted); }

/* ---------- 안내 화면: 한 줄(Line) UI ---------- */
.pin { position: sticky; top: var(--head, 76px); z-index: 5; background: var(--bg); padding: 8px 0 6px; }
.status { border: 4px solid var(--accent); border-radius: 18px; padding: 12px 16px; margin-bottom: 10px; background: var(--panel); }
.status .now { font-size: 18px; color: var(--muted); }
.status .big { font-size: 34px; font-weight: 900; line-height: 1.15; margin: 4px 0; overflow-wrap: anywhere; }
.status .sub { font-size: 22px; }
.status .mins { color: var(--accent); font-variant-numeric: tabular-nums; }
.status.alert { border-color: var(--bad); animation: pulse 1s 3; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad) 45%, transparent); } }
.controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.controls .btn { flex-direction: column; gap: 0; padding: 4px; min-height: 60px; font-size: 15px; }
.line { list-style: none; margin: 0; padding: 0; position: relative; }
.node { position: relative; padding: 10px 10px 10px 74px; min-height: 64px; border-radius: 12px; scroll-margin: calc(var(--head, 76px) + 230px) 0 120px; }
.node::before { /* 굵은 선 — 구간 색 */
  content: ""; position: absolute; left: 26px; top: 0; bottom: 0; width: 12px; background: var(--seg, var(--line));
  border-left: 2px solid var(--line); border-right: 2px solid var(--line);
}
.node.first::before { top: 50%; }
.node.last::before { bottom: 50%; }
.node.walk::before { background: repeating-linear-gradient(var(--line) 0 8px, transparent 8px 16px); border: 0; left: 30px; width: 6px; }
.node .dot {
  position: absolute; left: 16px; top: 50%; width: 32px; height: 32px; margin-top: -16px; border-radius: 50%;
  background: var(--bg); border: 5px solid var(--line); z-index: 1;
}
.node.stop .dot { left: 21px; width: 22px; height: 22px; margin-top: -11px; border-width: 4px; }
.node.board .dot, .node.alight .dot, .node.dest .dot { background: var(--fg); }
.node.walk .dot { display: none; }
.node .nm { font-size: 22px; font-weight: 800; overflow-wrap: anywhere; }
.node.stop .nm { font-size: 19px; font-weight: 700; }
.node .meta { font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node.passed { opacity: .45; }
.node.here { background: color-mix(in srgb, var(--accent) 22%, transparent); outline: 3px solid var(--accent); }
.node.here .dot { border-color: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 45%, transparent); }
.node.cursor { outline: 4px dashed var(--focus); }
.here-tag { display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 0 8px; font-size: 16px; font-weight: 900; margin-left: 6px; vertical-align: middle; }
.legbar { margin: 10px 0 6px 64px; }
.delay { color: var(--bad); font-weight: 900; }

/* ---------- 대화상자 ---------- */
dialog { background: var(--panel); color: var(--fg); border: 4px solid var(--border); border-radius: 18px; padding: 20px; width: min(560px, calc(100% - 24px)); }
dialog::backdrop { background: rgba(0,0,0,.75); }
dialog h2 { margin-top: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.row .btn { flex: 1 1 auto; }
fieldset { border: 3px solid var(--border); border-radius: var(--radius); margin: 0 0 14px; }
legend { padding: 0 6px; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }
footer { color: var(--dim); font-size: 15px; font-weight: 500; padding: 20px 0 40px; }
@media (max-width: 480px) {
  .logo h1 { font-size: 21px; }
  .status .big { font-size: 30px; }
  .btn { padding: 0 12px; }
}
@media (prefers-reduced-motion: reduce) { .status.alert { animation: none; } }
</style>
</head>

    <div class="logo">

      <h1 id="appname">Linjen</h1>
    </div>
    <div class="langs" role="group" id="langs">
      <button type="button" class="btn small" data-lang="sv" lang="sv">SV</button>
      <button type="button" class="btn small" data-lang="en" lang="en">EN</button>
      <button type="button" class="btn small" data-lang="ko" lang="ko">한</button>
    </div>
    <button type="button" class="btn small" id="settingsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span class="sr-only" id="settingsLbl"></span></button>
  </div>
</header>

<main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>

<!-- 화면 읽기 프로그램용 안내 (음성 안내와 같은 문장) -->
<div class="sr-only" aria-live="assertive" aria-atomic="true" id="live"></div>

<dialog id="settings" aria-labelledby="setTitle">
  <h2 id="setTitle"></h2>
  <fieldset><legend id="lgVoice"></legend><div class="choice">
    <button type="button" class="btn small" id="voiceOn"></button><button type="button" class="btn small" id="voiceOff"></button>
  </div></fieldset>
  <fieldset><legend id="lgContrast"></legend><div class="choice">
    <button type="button" class="btn small" data-contrast="high" id="cHigh"></button><button type="button" class="btn small" data-contrast="normal" id="cNormal"></button>
  </div></fieldset>
  <label class="field"><span id="lbPass"></span><input type="password" id="pass" autocomplete="current-password"></label>
  <details><summary id="lbDev" style="cursor:pointer;margin-bottom:10px"></summary>
    <label class="field"><span id="lbToken"></span><input type="password" id="manualToken" autocomplete="off"></label>
  </details>
  <p class="muted" id="tokenState"></p>
  <div class="row"><button type="button" class="btn primary" id="setSave"></button><button type="button" class="btn" id="setClose"></button></div>
</dialog>

  inp.onfocus = () => { sel = S[k] ? -1 : 0; build(); };
  inp.onkeydown = (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!items.length) return;
      sel = e.key === "ArrowDown" ? Math.min(items.length - 1, sel + 1) : Math.max(0, sel - 1);
      render(); e.preventDefault();
      say(items[sel].name, false, true);                  // 고른 보기 미리 듣기
    } else if (e.key === "Enter") {
      if (items.length && !ul.hidden) { choose(sel < 0 ? 0 : sel); e.preventDefault(); }
    } else if (e.key === "Escape") { items = []; state = ""; render(); }
  };
  inp.onblur = () => setTimeout(() => {
    if (!S[k] && inp.value.trim() && items.length) choose(sel < 0 ? 0 : sel);   // 고르지 않고 나가면 첫 보기
    ul.hidden = true; inp.setAttribute("aria-expanded", "false");
  }, 180);
  $("cl-" + k).onclick = () => { S[k] = null; inp.value = ""; showPick(k); inp.focus(); };
  showPick(k);
}
function useMyLocation() {
  if (!navigator.geolocation) { say(t().geoErr); return; }
  navigator.geolocation.getCurrentPosition(async (p) => {
    try {
      const d = JSON.parse(await api("/locations/by-coordinates", { latitude: p.coords.latitude, longitude: p.coords.longitude, radiusInMeters: 600, limit: 1, types: "stoparea" }));
      const r = (d.results || [])[0];
      if (!r) throw new Error("geo");
      S.from = { name: r.name, gid: r.gid, lat: r.latitude, lon: r.longitude, type: r.locationType };
      $("in-from").value = splitName(r.name)[0]; showPick("from"); rememberPlace(S.from); say(`${t().chosen}: ${r.name}`, false, true);
    } catch (e) { say(errText(e)); }
  }, () => say(t().geoErr), { enableHighAccuracy: true, timeout: 15000 });
}
function locParams(prefix, l) {
  if (l.gid && l.type === "stoparea") return { [prefix + "Gid"]: l.gid };
  return { [prefix + "Latitude"]: l.lat, [prefix + "Longitude"]: l.lon, [prefix + "Name"]: l.name };
}

// ======================================================================
//  화면 2: 경로 고르기
// ======================================================================
async function search() {
  if (!S.from || !S.to) { say(t().pickFrom); viewSearch(t().pickFrom); return; }
  const v = $("view"); v.innerHTML = `<h2>${esc(t().searching)}</h2>`; say(t().searching);
  let txt;
  try { txt = await api("/journeys", { ...locParams("origin", S.from), ...locParams("destination", S.to), limit: 5 }); }
  catch (e) { viewSearch(errText(e)); say(errText(e), true); return; }
  const opts = JSON.parse(wout(S.g.journeys_set(...wput(txt))));
  S.options = opts;
  const rec = store.get("recent", []).filter(r => !(r.from.name === S.from.name && r.to.name === S.to.name));
  store.set("recent", [{ from: S.from, to: S.to }, ...rec].slice(0, 5));
  viewOptions();
}
function optText(o) {
  const L = t();
  return {
    dep: hhmm(o.dep), arr: hhmm(o.arr), minutes: o.minutes, changesTxt: L.changes(o.changes),
    lines: o.legs.map(l => `${MODE[S.lang][l.mode] || l.mode} ${l.line}`).join(", "),
  };
}
function viewOptions() {
  const v = $("view"), L = t(), opts = S.options.filter(o => !o.departed);
  if (!opts.length) { viewSearch(L.noTrips); say(L.noTrips); return; }
  v.innerHTML = `<h2 id="h">${esc(L.options)}</h2>
    <p class="muted">${esc(S.from.name)} → ${esc(S.to.name)}</p>
    <ol class="opts" id="opts"></ol>
    <div class="actions" style="margin-top:16px"><button type="button" class="btn" id="back">← ${esc(L.back)}</button></div>`;
  const ol = $("opts");
  opts.forEach((o) => {
    const i = S.options.indexOf(o), ot = optText(o);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn opt";
    b.setAttribute("aria-label", L.optSay(ot));
    b.innerHTML = `<div class="t">${esc(ot.dep)} → ${esc(ot.arr)}</div>
      <div class="d">${o.minutes} ${esc(L.min)} · ${esc(ot.changesTxt)}${o.walk ? " · " + esc(L.walkMin(o.walk)) : ""}</div>
      <div class="badges" aria-hidden="true">${o.legs.map(l => `<span class="badge" style="background:${esc(l.bg)};color:${esc(l.fg)}">${esc(l.line)}</span>`).join('<span class="arrow">→</span>')}</div>`;
    b.onclick = () => startTrip(i);
    b.onfocus = () => say(L.optSay(ot));
    li.append(b); ol.append(li);
  });
  $("back").onclick = () => viewSearch();
  $("h").focus?.();
  say(L.found(opts.length, optText(opts[0]).dep));
}

// ======================================================================
//  화면 3: 한 줄 안내
// ======================================================================
async function startTrip(i) {
  S.pick = i;
  const v = $("view"); v.innerHTML = `<h2>${esc(t().searching)}</h2>`;
  const ref = wout(S.g.journey_ref(i));
  let det = "";
  try { det = await api("/journeys/" + encodeURIComponent(ref) + "/details", { includes: "servicejourneycalls" }); }
  catch (e) { /* 세부 정보 없이도 출발·도착만으로 안내 가능 */ }
  S.model = JSON.parse(wout(S.g.trip_build(i, ...wput(det || "{}"))));
  S.cursor = 0;
  renderGuide();
  tick(true);
  // 화면 꺼짐 방지 (지원되는 브라우저에서) — 응답을 기다리지 않는다
  if (navigator.wakeLock) navigator.wakeLock.request("screen").then(w => { S.wake = w; }, () => {});
  S.tick = setInterval(() => tick(false), 5000);
  S.poll = setInterval(refresh, 20000);                 // 15~30초 주기로 실시간 시각 갱신
}
function stopGuidance() {
  clearInterval(S.tick); clearInterval(S.poll); S.tick = S.poll = 0;
  if (S.wake) { try { S.wake.release(); } catch (e) {} S.wake = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
async function refresh() {
  if (S.pick < 0) return;
  try {
    const det = await api("/journeys/" + encodeURIComponent(wout(S.g.journey_ref(S.pick))) + "/details", { includes: "servicejourneycalls" });
    S.model = JSON.parse(wout(S.g.trip_update(S.pick, ...wput(det))));
    renderLine();
  } catch (e) { /* 다음 주기에 다시 */ }
}
function nodeInfo(nd) {
  const L = t();
  const line = S.model.lines[nd.leg] || {};
  const time = hhmm(nd.kind === "board" ? nd.dep : (nd.arr || nd.dep));
  let kindTxt = L.kind[nd.kind];
  if (nd.kind === "board" && line.line) kindTxt = `${L.kind.board} ${MODE[S.lang][line.mode] || line.mode} ${line.line}`;
  if (nd.kind === "walk") kindTxt = `${L.kind.walk} (${L.walkMin(nd.walk)})`;
  return { kindTxt, name: nd.name + (nd.platform ? ` (${nd.platform})` : ""), time, line };
}
function renderGuide() {
  const L = t();
  $("view").innerHTML = `
    <div class="pin"><section class="status" id="status" aria-labelledby="stNow"><div class="now" id="stNow"></div><div class="big" id="stBig"></div><div class="sub" id="stSub"></div></section>
    <div class="controls">
      <button type="button" class="btn" id="cRepeat">🔊<span>${esc(L.repeat)}</span></button>
      <button type="button" class="btn" id="cPrev">◀<span>${esc(L.prev)}</span></button>
      <button type="button" class="btn" id="cNext">▶<span>${esc(L.next)}</span></button>
      <button type="button" class="btn" id="cStop">✕<span>${esc(L.stop)}</span></button>
    </div></div>
    <p class="muted" style="font-size:17px">${esc(L.swipeHint)}</p>
    <ol class="line" id="line" aria-label="${esc(S.from ? S.from.name + " → " + S.to.name : "")}"></ol>`;
  $("cRepeat").onclick = () => say(S.lastSay || statusText(), true);
  $("cPrev").onclick = () => moveCursor(-1);
  $("cNext").onclick = () => moveCursor(1);
  $("cStop").onclick = () => { stopGuidance(); S.pick = -1; viewSearch(); };
  renderLine();
}
function renderLine() {
  const ol = $("line"); if (!ol || !S.model) return;
  const L = t(), nodes = S.model.nodes, k = S.status ? S.status.k : -1;
  ol.innerHTML = "";
  nodes.forEach((nd, i) => {
    const info = nodeInfo(nd);
    const li = document.createElement("li");
    li.className = `node ${nd.kind}` + (i === 0 ? " first" : "") + (i === nodes.length - 1 ? " last" : "") +
      (i < hereIndex() ? " passed" : "") + (i === hereIndex() ? " here" : "") + (i + 1 === S.cursor ? " cursor" : "");
    li.id = "n" + i; li.tabIndex = -1;
    // 선 색 = 그 구간 노선 색 (도보는 점선, 도착지는 마지막 구간 색)
    if (nd.kind !== "walk" && info.line.bg) li.style.setProperty("--seg", info.line.bg);
    const delay = nd.delay ? ` <span class="delay">${nd.delay > 0 ? "+" : ""}${nd.delay}</span>` : "";
    const badge = nd.kind === "board" && info.line.line ? `<div class="badges" aria-hidden="true"><span class="badge" style="background:${esc(info.line.bg)};color:${esc(info.line.fg)}">${esc(info.line.line)}</span><span>${esc(info.line.dir)}</span></div>` : "";
    li.innerHTML = `<span class="dot" aria-hidden="true"></span>
      <div class="nm">${esc(nd.name)}${nd.platform ? ` <span class="muted">· ${esc(nd.platform)}</span>` : ""}${S.status && i === hereIndex() ? `<span class="here-tag">${esc(L.here)}</span>` : ""}</div>
      <div class="meta">${esc(info.kindTxt)} · ${esc(info.time)}${delay}</div>${badge}`;
    li.setAttribute("aria-label", L.nodeSay(i + 1, nodes.length, info) + (S.status && i === hereIndex() ? " " + L.here : ""));
    ol.append(li);
  });
}
/** 화면에 '현재 위치'로 표시할 노드: 차 안이면 방금 지난 정류장, 기다리는 중이면 탈 정류장 */
function hereIndex() {
  const s = S.status; if (!s || !S.model) return -1;
  if (s.phase === "wait" || s.phase === "transfer") return s.next;
  if (s.phase === "arrived") return S.model.nodes.length - 1;
  return Math.max(0, s.k);
}
function statusText() {
  const s = S.status, L = t(); if (!s || !S.model) return "";
  const nd = S.model.nodes[s.next], info = nodeInfo(nd);
  if (s.phase === "arrived") return L.ev.arrived({ stop: S.model.nodes[S.model.nodes.length - 1].name });
  if (s.phase === "ride") return L.ev.next_stop({ stop: nd.name, left: 0 }) + ` ${s.mins} ${L.min}.`;
  return `${L.status[s.phase]}: ${info.kindTxt} ${info.name}, ${info.time}.`;
}
function tick(first) {
  if (!S.model) return;
  const s = JSON.parse(wout(S.g.trip_tick(Date.now())));
  const moved = !S.status || s.k !== S.status.k || s.phase !== S.status.phase;
  S.status = s;
  const L = t(), nd = S.model.nodes[s.next], info = nodeInfo(nd);
  $("stNow").textContent = L.status[s.phase] || "";
  $("stBig").textContent = s.phase === "arrived" ? S.model.nodes[S.model.nodes.length - 1].name : nd.name + (nd.platform ? ` · ${nd.platform}` : "");
  $("stSub").innerHTML = s.phase === "arrived" ? "" : `${esc(info.kindTxt)} · <span class="mins">${s.mins} ${esc(L.min)}</span> · ${esc(info.time)}`;
  if (s.event) {
    const e = s.event, urgent = /alight|board_now|arrived/.test(e.code);
    const ln = e.line || {};
    const text = L.ev[e.code] ? L.ev[e.code]({ ...e, line: ln.line || "", dir: ln.dir || "", modeTxt: MODE[S.lang][ln.mode] || ln.mode || "" }) : "";
    $("status").classList.toggle("alert", urgent);
    say(text, urgent);
  }
  if (moved || first) {
    renderLine();
    const here = $("n" + hereIndex());
    if (here) here.scrollIntoView({ block: "center", behavior: first ? "auto" : "smooth" });
  }
  if (s.phase === "arrived") { clearInterval(S.tick); clearInterval(S.poll); }
}
/** 스와이프·이전/다음: 0 = 현재 상태, 1..n = 노드 */
function moveCursor(d) {
  if (!S.model) return;
  const n = S.model.nodes.length;
  if (S.cursor === 0 && d > 0) S.cursor = Math.max(1, hereIndex() + 1);
  else S.cursor = Math.max(0, Math.min(n, S.cursor + d));
  renderLine();
  if (S.cursor === 0) { say(statusText(), true); $("status").focus?.(); return; }
  const nd = S.model.nodes[S.cursor - 1];
  say(t().nodeSay(S.cursor, n, nodeInfo(nd)), true);
  const li = $("n" + (S.cursor - 1));
  if (li) { li.scrollIntoView({ block: "center", behavior: "smooth" }); li.focus({ preventScroll: true }); }
}

// ---------- 화면 어디서든 스와이프 (가로만 — 세로는 스크롤에 양보) ----------
let sx = 0, sy = 0, st0 = 0;
document.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; st0 = Date.now(); }, { passive: true });
document.addEventListener("pointerup", (e) => {
  if (!S.model || !$("line")) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Date.now() - st0 < 700 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) moveCursor(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener("keydown", (e) => {
  if (!S.model || !$("line") || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "j") { moveCursor(1); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "k") { moveCursor(-1); e.preventDefault(); }
  if (e.key === " " || e.key === "r") { say(S.lastSay || statusText(), true); e.preventDefault(); }
});

// ======================================================================
//  설정 대화상자
// ======================================================================
function openSettings() {
  const d = $("settings");
  $("pass").value = store.get("pass", "");
  $("manualToken").value = store.get("manualToken", "");
  updateSettingsText();
  d.showModal();
}
function updateSettingsText() {
  const L = t();
  $("setTitle").textContent = L.setTitle; $("lgVoice").textContent = L.voice; $("voiceOn").textContent = L.on; $("voiceOff").textContent = L.off;
  $("lgContrast").textContent = L.contrast; $("cHigh").textContent = L.high; $("cNormal").textContent = L.normal;
  $("lbPass").textContent = L.pass; $("lbDev").textContent = L.dev; $("lbToken").textContent = L.token;
  $("setSave").textContent = L.save; $("setClose").textContent = L.close;
  $("voiceOn").setAttribute("aria-pressed", String(S.voice)); $("voiceOff").setAttribute("aria-pressed", String(!S.voice));
  const c = document.documentElement.dataset.contrast;
  $("cHigh").setAttribute("aria-pressed", String(c === "high")); $("cNormal").setAttribute("aria-pressed", String(c === "normal"));
  const left = Math.floor((S.tokenExp - Date.now()) / 3600e3);
  $("tokenState").textContent = S.token && left >= 0 ? L.tokOk(left) : L.tokNone;
}
$("settingsBtn").onclick = openSettings;
$("setClose").onclick = () => $("settings").close();
$("voiceOn").onclick = () => { S.voice = true; store.set("voice", true); updateSettingsText(); say(t().on); };
$("voiceOff").onclick = () => { S.voice = false; store.set("voice", false); speechSynthesis?.cancel(); updateSettingsText(); };
for (const id of ["cHigh", "cNormal"]) $(id).onclick = (e) => {
  const c = e.currentTarget.dataset.contrast; document.documentElement.dataset.contrast = c; store.set("contrast", c); updateSettingsText();
};
$("setSave").onclick = async () => {
  store.set("pass", $("pass").value.replace(/\s+/g, ""));
  store.set("manualToken", $("manualToken").value.trim());
  S.token = null;
  try { await getToken(true); updateSettingsText(); say(t().tokOk(Math.floor((S.tokenExp - Date.now()) / 3600e3))); $("settings").close(); }
  catch (e) { $("tokenState").textContent = errText(e); say(errText(e), true); }
};

// ======================================================================
//  언어 전환 (화면 글자 + 음성 언어 동시에)
// ======================================================================
function applyLang(lang) {
  S.lang = lang; store.set("lang", lang);
  document.documentElement.lang = lang;
  const L = t();
  document.title = `${L.app} – Västtrafik`;
  $("appname").textContent = L.app; $("skip").textContent = L.skip; $("settingsLbl").textContent = L.settings;
  $("settingsBtn").setAttribute("aria-label", L.settings);
  document.querySelectorAll("#langs .btn").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    b.setAttribute("aria-label", { sv: "Svenska", en: "English", ko: "한국어" }[b.dataset.lang]);
  });
  $("foot") && ($("foot").textContent = L.footer);
  if ($("settings").open) updateSettingsText();
}
document.querySelectorAll("#langs .btn").forEach(b => b.onclick = () => {
  applyLang(b.dataset.lang);
  say({ sv: "Svenska", en: "English", ko: "한국어" }[b.dataset.lang], true);
  if (S.model && $("line")) { renderGuide(); tick(true); }
  else if ($("opts")) viewOptions();
  else viewSearch();
});

// ======================================================================
//  시작
// ======================================================================
// 고정 머리글 높이 → 상태 상자가 그 아래에 붙도록
const setHead = () => document.documentElement.style.setProperty("--head", document.querySelector("header").offsetHeight + "px");
addEventListener("resize", setHead);
/** 초대 링크 (…/gt/#k=앱암호): 암호를 이 기기에 저장하고 주소창에서는 지운다. '#' 뒤는 서버로 전송되지 않는다. */
function takeInviteKey() {
  const m = /(?:^#|&)k=([^&]+)/.exec(location.hash);
  if (!m) return;
  store.set("pass", decodeURIComponent(m[1]).trim());
  history.replaceState(null, "", location.pathname + location.search);
}
(async function main() {
  takeInviteKey();
  document.documentElement.dataset.contrast = store.get("contrast", "high");
  const f = document.createElement("footer"); f.innerHTML = `<div class="wrap" id="foot"></div>`; document.body.append(f);
  applyLang(S.lang);
  setHead();
  try { S.g = await loadWasm(); }
  catch (e) { $("view").innerHTML = `<p class="msg bad" role="alert">WebAssembly: ${esc(e.message)}</p>`; return; }
  viewSearch();
  try { await getToken(); }
  catch (e) { if (e.message === "needPass") openSettings(); }
})();
</script>
