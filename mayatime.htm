<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Mayan Calendar & Real-time Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; z-index: 10; pointer-events: none; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Mayan Canvas Clock UI */
        #maya-ui-clock {
            background: rgba(15, 12, 10, 0.85);
            border: 2px solid #a37c35;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(163, 124, 53, 0.2);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer" class="p-6">
        <!-- Top Header & 2D UI Clock -->
        <div class="flex justify-between items-start w-full">
            <div>
                <h1 class="text-3xl md:text-5xl font-black tracking-widest text-amber-500 drop-shadow-[0_4px_6px_rgba(0,0,0,0.9)]" style="font-family: serif;">MAYA CHRONOS</h1>
                <p class="text-sm md:text-lg opacity-90 text-amber-100/70 mt-1 uppercase tracking-widest drop-shadow-md">Tzolk'in • Haab • Time</p>
            </div>
            
            <div class="text-right flex flex-col items-end pointer-events-auto">
                <div class="bg-black/80 px-3 py-1 rounded border border-amber-900/50 mb-2">
                    <p class="text-[10px] text-amber-400/80 tracking-[0.2em] font-bold uppercase">Real-Time</p>
                </div>
                <!-- 2D Canvas for Maya UI Clock -->
                <canvas id="maya-ui-clock" width="120" height="240"></canvas>
            </div>
        </div>

        <!-- Camera Control Button -->
        <div class="w-full flex justify-center pb-8">
            <button id="toggle-cam-btn" class="pointer-events-auto px-10 py-4 bg-gradient-to-b from-stone-800 to-stone-900 border-2 border-amber-600/60 text-amber-500 font-bold rounded-full hover:scale-105 hover:bg-stone-700 hover:text-amber-300 hover:shadow-[0_0_20px_rgba(217,119,6,0.4)] transition-all duration-300 uppercase tracking-widest text-sm shadow-2xl relative overflow-hidden">
                <span class="relative z-10">Read The Gate (Zoom In)</span>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. MAYAN 2D DRAWING ENGINE (Canvas)
        // ==========================================
        
        function drawMayaNumeral(ctx, num, cx, cy, scale = 1, color = '#000000') {
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 6 * scale; // Bold lines

            function drawTier(n, ty) {
                if (n === 0) { // Shell symbol for Zero
                    ctx.beginPath();
                    ctx.ellipse(cx, ty, 20 * scale, 12 * scale, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx - 15*scale, ty); ctx.lineTo(cx + 15*scale, ty);
                    ctx.moveTo(cx - 8*scale, ty - 8*scale); ctx.lineTo(cx - 4*scale, ty + 8*scale);
                    ctx.moveTo(cx + 8*scale, ty - 8*scale); ctx.lineTo(cx + 4*scale, ty + 8*scale);
                    ctx.stroke();
                    return;
                }

                const bars = Math.floor(n / 5);
                const dots = n % 5;
                const barSpacing = 14 * scale;
                const base = ty + (bars * barSpacing) / 2 - (bars > 0 ? barSpacing/2 : 0);
                
                // Bars (5s)
                for (let i = 0; i < bars; i++) {
                    ctx.beginPath();
                    ctx.roundRect(cx - 24*scale, base - i * barSpacing, 48*scale, 10*scale, 5*scale);
                    ctx.fill();
                }
                
                // Dots (1s)
                const dotY = base - bars * barSpacing - 14*scale;
                const dotSpacing = 16 * scale; 
                const startX = cx - ((dots - 1) * dotSpacing) / 2;
                for (let i = 0; i < dots; i++) {
                    ctx.beginPath();
                    ctx.arc(startX + i * dotSpacing, dotY, 6 * scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            if (num < 20) {
                drawTier(num, cy);
            } else {
                // Base 20 Stacking
                const twenties = Math.floor(num / 20);
                const units = num % 20;
                drawTier(twenties, cy - 25*scale);
                drawTier(units, cy + 25*scale);
            }
        }

        // Procedural Cartouche for Tzolk'in / Haab Glyphs
        function drawMayaGlyph(ctx, index, cx, cy, scale = 1, color = '#000000') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 8;
            ctx.lineJoin = 'round';

            // Main Cartouche Body
            ctx.beginPath();
            ctx.roundRect(-32, -32, 64, 64, 16);
            ctx.stroke();

            // Inner procedural design based on pseudo-random hash
            const seed = (index * 137) % 29;
            ctx.lineWidth = 5;
            
            if (seed % 3 === 0) { 
                ctx.beginPath(); ctx.arc(-10, -10, 8, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(10, -10, 8, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-15, 10); ctx.quadraticCurveTo(0, 25, 15, 10); ctx.stroke();
            } else if (seed % 3 === 1) { 
                ctx.beginPath(); ctx.moveTo(-20, -20); ctx.lineTo(-20, 20); ctx.lineTo(0, 20); ctx.lineTo(0, 5); ctx.lineTo(20, 5); ctx.stroke();
                for(let i=0; i<3; i++) { ctx.beginPath(); ctx.arc(12, -12 + i*10, 4, 0, Math.PI*2); ctx.fill(); }
            } else { 
                ctx.beginPath(); ctx.moveTo(-20, 15); ctx.bezierCurveTo(-5, -25, 25, -25, 15, 15); ctx.stroke();
                ctx.beginPath(); ctx.arc(-8, 5, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(8, 5, 5, 0, Math.PI*2); ctx.fill();
            }
            
            ctx.restore();
        }

        // ==========================================
        // 2. PROCEDURAL HIGH-RES TEXTURE GENERATOR
        // ==========================================
        function generateGearTexture(innerR, outerR, slots, typeFunc, markingColor) {
            const size = 2048; // Crisp 2K resolution
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size / 2;
            const cy = size / 2;

            // Fill Base Stone Color
            ctx.fillStyle = '#e0d8c0'; // Bright beige/stone
            ctx.fillRect(0, 0, size, size);

            const R_out = size / 2;
            const R_in = R_out * (innerR / outerR);
            const R_mid = (R_in + R_out) / 2;
            const ringWidth = R_out - R_in;
            
            const scaleNum = ringWidth / 130; 
            const scaleGlyph = ringWidth / 110;

            for (let i = 0; i < slots; i++) {
                const angle = (i / slots) * Math.PI * 2;
                
                // Draw Markings
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(-angle); 
                ctx.translate(R_mid, 0);
                ctx.rotate(Math.PI / 2); // Orient towards outer edge

                const valInfo = typeFunc(i);
                if (valInfo.type === 'numeral') {
                    drawMayaNumeral(ctx, valInfo.value, 0, 0, scaleNum, markingColor);
                } else {
                    drawMayaGlyph(ctx, valInfo.value, 0, 0, scaleGlyph, markingColor);
                }
                ctx.restore();

                // Draw Separator Grooves
                ctx.save();
                ctx.translate(cx, cy);
                const sepAngle = -angle - (Math.PI * 2) / (slots * 2);
                ctx.rotate(sepAngle);
                ctx.strokeStyle = '#c5bca0'; // Slightly darker groove
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(R_in + 10, 0);
                ctx.lineTo(R_out - 10, 0);
                ctx.stroke();
                ctx.restore();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 16; // High quality texture filtering
            tex.colorSpace = THREE.SRGBColorSpace; 
            return tex;
        }

        // ==========================================
        // 3. UI MAYAN CLOCK (Top Right)
        // ==========================================
        const uiCtx = document.getElementById('maya-ui-clock').getContext('2d');
        function updateUIClock(h, m, s) {
            uiCtx.clearRect(0, 0, 120, 240);
            const gold = '#eab308';
            drawMayaNumeral(uiCtx, h, 60, 45, 1.1, gold);
            drawMayaNumeral(uiCtx, m, 60, 120, 1.1, gold);
            drawMayaNumeral(uiCtx, s, 60, 195, 1.1, gold);

            uiCtx.strokeStyle = 'rgba(234, 179, 8, 0.3)';
            uiCtx.lineWidth = 1;
            uiCtx.beginPath(); uiCtx.moveTo(20, 82); uiCtx.lineTo(100, 82); uiCtx.stroke();
            uiCtx.beginPath(); uiCtx.moveTo(20, 157); uiCtx.lineTo(100, 157); uiCtx.stroke();
        }

        // ==========================================
        // 4. THREE.JS SCENE SETUP & LIGHTING
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.012);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // LIGHTING FIX: Strong standard lights to illuminate the stone bodies
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 1.5);
        topLight.position.set(0, 30, 10);
        topLight.castShadow = true;
        topLight.shadow.mapSize.width = 2048;
        topLight.shadow.mapSize.height = 2048;
        scene.add(topLight);

        // ==========================================
        // 5. GEAR CONSTRUCTION ENGINE
        // ==========================================
        // Material for the main stone body (sides and bottom)
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0xe0d8c0, 
            roughness: 0.85, 
            metalness: 0.1 
        });

        function createThickRing(innerR, outerR, height, slots, typeFunc, hasTeeth, markingColor) {
            const group = new THREE.Group();

            // 1. Solid Body (ExtrudeGeometry)
            const shape = new THREE.Shape();
            shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
            const hole = new THREE.Path();
            hole.absarc(0, 0, innerR, 0, Math.PI * 2, true);
            shape.holes.push(hole);

            const extSettings = { depth: height, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.1, bevelThickness: 0.1, curveSegments: 64 };
            const geo = new THREE.ExtrudeGeometry(shape, extSettings);
            geo.rotateX(Math.PI / 2); // Extrude downwards into -Y
            
            const ringMesh = new THREE.Mesh(geo, bodyMat);
            ringMesh.receiveShadow = true;
            ringMesh.castShadow = true;
            group.add(ringMesh);

            // 2. Top Face with Canvas Texture (MeshBasicMaterial for 100% visibility)
            const topTex = generateGearTexture(innerR, outerR, slots, typeFunc, markingColor);
            const topMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, // Keep white to show exact texture colors
                map: topTex, 
                side: THREE.DoubleSide
            });
            
            const topGeo = new THREE.RingGeometry(innerR, outerR, 128);
            topGeo.rotateX(-Math.PI / 2); // Face upwards
            const topMesh = new THREE.Mesh(topGeo, topMat);
            topMesh.position.y = 0.02; // Raise slightly above ExtrudeGeometry to prevent z-fighting
            group.add(topMesh);

            // 3. Teeth (Mechanical interaction)
            if(hasTeeth) {
                const toothGeo = new THREE.BoxGeometry(0.8, height * 0.9, (outerR - innerR)*0.3);
                for(let i=0; i<slots; i++) {
                    const angle = (i/slots) * Math.PI * 2;
                    const tooth = new THREE.Mesh(toothGeo, bodyMat);
                    tooth.position.set(Math.cos(angle) * (outerR + 0.1), -height/2, -Math.sin(angle) * (outerR + 0.1));
                    tooth.rotation.y = angle;
                    tooth.castShadow = true;
                    tooth.receiveShadow = true;
                    group.add(tooth);
                }
            }

            scene.add(group);
            return group;
        }

        const HEIGHT = 1.2;

        // INNER DATE GEARS (Red Markings)
        const gearTzNum = createThickRing(3, 6, HEIGHT, 13, (i) => ({type: 'numeral', value: i + 1}), false, '#cc0000');
        const gearTzGlyph = createThickRing(6.2, 10, HEIGHT, 20, (i) => ({type: 'glyph', value: i}), false, '#cc0000');
        const gearHaab = createThickRing(10.2, 14, HEIGHT, 19, (i) => ({type: 'glyph', value: i + 20}), true, '#cc0000');

        // OUTER TIME GEARS (Black Markings)
        const gearHours = createThickRing(15, 19, HEIGHT, 24, (i) => ({type: 'numeral', value: i}), true, '#000000');
        const gearMinutes = createThickRing(19.2, 23, HEIGHT, 60, (i) => ({type: 'numeral', value: i}), true, '#000000');
        const gearSeconds = createThickRing(23.2, 27, HEIGHT, 60, (i) => ({type: 'numeral', value: i}), true, '#000000');

        // Center Pin
        const coreGeo = new THREE.CylinderGeometry(2.8, 2.8, HEIGHT * 1.5, 32);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x5a4a35, metalness: 0.6, roughness: 0.5 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.position.y = -HEIGHT/2;
        scene.add(core);

        // ==========================================
        // 6. INDICATOR GATE (Reading Frame)
        // ==========================================
        const gateGroup = new THREE.Group();
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 }); // Bright Gold
        const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.6 });

        // Left/Right Rails spanning from inner to outer gears
        const frameL = new THREE.Mesh(new THREE.BoxGeometry(26, 0.5, 0.8), metalMat);
        frameL.position.set(15, 0.5, 2.5); frameL.castShadow = true;
        const frameR = new THREE.Mesh(new THREE.BoxGeometry(26, 0.5, 0.8), metalMat);
        frameR.position.set(15, 0.5, -2.5); frameR.castShadow = true;
        
        // Caps and Divider
        const capIn = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 5.8), metalMat);
        capIn.position.set(2, 0.5, 0); capIn.castShadow = true;
        const capOut = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 5.8), metalMat);
        capOut.position.set(28, 0.5, 0); capOut.castShadow = true;
        const divider = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 5.8), darkMetalMat);
        divider.position.set(14.5, 0.6, 0); divider.castShadow = true;

        // Text Labels for Frames
        function createGateLabel(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,256,64);
            ctx.fillStyle = '#d4af37'; ctx.font = 'bold 44px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 32);
            
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: tex });
            const plane = new THREE.Mesh(new THREE.PlaneGeometry(5, 1.2), mat);
            plane.rotation.x = -Math.PI/2;
            plane.rotation.z = Math.PI/2; 
            return plane;
        }

        const dateLabel = createGateLabel("DATE (RED)");
        dateLabel.position.set(14.5, 0.96, -3.8);
        const timeLabel = createGateLabel("TIME (BLACK)");
        timeLabel.position.set(14.5, 0.96, 3.8);

        // Position Pointers at ends
        const ptrGeo = new THREE.ConeGeometry(0.6, 1.2, 4);
        const ptr1 = new THREE.Mesh(ptrGeo, metalMat);
        ptr1.position.set(28, 0.5, 0); ptr1.rotation.z = Math.PI/2;
        const ptr2 = new THREE.Mesh(ptrGeo, metalMat);
        ptr2.position.set(2, 0.5, 0); ptr2.rotation.z = -Math.PI/2;

        gateGroup.add(frameL, frameR, capIn, capOut, divider, dateLabel, timeLabel, ptr1, ptr2);
        gateGroup.position.y = 0.2; // Float slightly above gears
        scene.add(gateGroup);


        // ==========================================
        // 7. TIME SYNC & ANIMATION MECHANICS
        // ==========================================
        const state = { h: -1, m: -1, s: -1, tzNum: -1, tzGlyph: -1, haab: -1 };

        function tickGear(mesh, oldVal, newVal, slots, duration, ease) {
            if (oldVal === -1) {
                mesh.rotation.y = (newVal * Math.PI * 2) / slots; 
                return newVal;
            }
            if (oldVal !== newVal) {
                let diff = newVal - oldVal;
                if (diff < 0) diff += slots;
                let nextAngle = mesh.rotation.y + (diff * 2 * Math.PI) / slots;
                gsap.to(mesh.rotation, {y: nextAngle, duration: duration, ease: ease});
            }
            return newVal;
        }

        function updateMechanics() {
            const now = new Date();
            const s = now.getSeconds();
            const m = now.getMinutes();
            const h = now.getHours();

            // Maya Date Proxy (Using Epoch math for visual sync)
            const daysSinceEpoch = Math.floor(now.getTime() / 86400000);
            const tzNumIdx = daysSinceEpoch % 13; 
            const tzGlyphIdx = daysSinceEpoch % 20;
            const haabIdx = Math.floor((daysSinceEpoch % 365) / 20) % 19;

            if (state.s !== s) {
                updateUIClock(h, m, s);
                // Sharp Escapement Tick
                state.s = tickGear(gearSeconds, state.s, s, 60, 0.2, "back.out(1.5)");
            }
            
            // Smooth Chain Reactions
            state.m = tickGear(gearMinutes, state.m, m, 60, 0.6, "power2.inOut");
            state.h = tickGear(gearHours, state.h, h, 24, 1.0, "power2.inOut");
            
            state.tzNum = tickGear(gearTzNum, state.tzNum, tzNumIdx, 13, 1.5, "power3.inOut");
            state.tzGlyph = tickGear(gearTzGlyph, state.tzGlyph, tzGlyphIdx, 20, 1.5, "power3.inOut");
            state.haab = tickGear(gearHaab, state.haab, haabIdx, 19, 1.5, "power3.inOut");
        }


        // ==========================================
        // 8. CAMERA & GSAP INTERACTION
        // ==========================================
        const views = {
            overview: { pos: new THREE.Vector3(-20, 40, 30), lookAt: new THREE.Vector3(0, 0, 0) },
            detail:   { pos: new THREE.Vector3(15, 18, 12), lookAt: new THREE.Vector3(15, 0, 0) } // Focused on Gate
        };

        let isDetailView = false;
        const cameraTarget = views.overview.lookAt.clone();
        camera.position.copy(views.overview.pos);
        camera.lookAt(cameraTarget);

        const toggleBtn = document.getElementById('toggle-cam-btn');
        const btnText = toggleBtn.querySelector('span');

        toggleBtn.addEventListener('click', () => {
            isDetailView = !isDetailView;
            const view = isDetailView ? views.detail : views.overview;
            btnText.innerText = isDetailView ? "View Entire Mechanism (Zoom Out)" : "Read The Gate (Zoom In)";

            // GSAP Cinematic Transitions
            gsap.to(camera.position, {
                x: view.pos.x, y: view.pos.y, z: view.pos.z,
                duration: 2.0, ease: "power3.inOut"
            });

            gsap.to(cameraTarget, {
                x: view.lookAt.x, y: view.lookAt.y, z: view.lookAt.z,
                duration: 2.0, ease: "power3.inOut",
                onUpdate: () => camera.lookAt(cameraTarget)
            });
        });

        // ==========================================
        // 9. RENDER LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            updateMechanics();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = animate;

    </script>
</body>
</html>
